<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#F4EFE6"/>
      <stop offset="100%" stop-color="#EAE3D4"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8A9A78"/>
      <stop offset="100%" stop-color="#3D4A3E"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <!-- sun / moon: the body's own light source -->
  <circle cx="470" cy="278" r="126" fill="#C86446" opacity="0.9"/>
  <circle cx="470" cy="278" r="126" fill="none" stroke="#1C2833" stroke-width="2" opacity="0.14"/>

  <!-- soft horizon bands -->
  <path d="M0 470 C 160 430, 300 500, 460 468 C 600 440, 700 486, 800 462 L800 800 L0 800 Z" fill="url(#hill)" opacity="0.92"/>
  <path d="M0 556 C 180 520, 320 592, 500 556 C 640 528, 720 570, 800 548 L800 800 L0 800 Z" fill="#1C2833" opacity="0.86"/>

  <!-- organic rhythm strokes -->
  <g fill="none" stroke="#F7F4EE" stroke-width="3" stroke-linecap="round" opacity="0.34">
    <path d="M96 640 C 200 606, 300 676, 404 644 C 508 612, 604 668, 704 640"/>
    <path d="M96 692 C 200 658, 300 728, 404 696 C 508 664, 604 720, 704 692"/>
  </g>

  <!-- seed forms -->
  <ellipse cx="176" cy="330" rx="58" ry="94" transform="rotate(-22 176 330)" fill="#556B2F" opacity="0.55"/>
  <ellipse cx="662" cy="392" rx="40" ry="66" transform="rotate(18 662 392)" fill="#1C2833" opacity="0.28"/>

  <rect width="800" height="800" filter="url(#grain)" opacity="0.05"/>
</svg>
